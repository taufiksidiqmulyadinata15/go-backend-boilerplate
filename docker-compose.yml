services:
  app:
    build: .
    container_name: go_backend_boilerplate_app
    ports:
      - "8080:8080"
    environment:
      APP_NAME: Go Backend Boilerplate
      APP_ENV: development
      APP_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: go_boilerplate
      DB_SSLMODE: disable
      JWT_SECRET: supersecret
      JWT_EXPIRED_HOUR: 24
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: go_backend_boilerplate_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_boilerplate
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: